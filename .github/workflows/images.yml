# Checks the web app on every push. The images are built only on request (Actions → images → Run workflow),
# when a version is ready for the server. They are pushed to GitHub's registry:
#   ghcr.io/adil-arhrimaz/parapilot-erpnext  ERPNext 16.52.1 with the parapilot app
#   ghcr.io/adil-arhrimaz/parapilot-web      the Next.js app
# Each image is tagged with the commit (sha-xxxxxxx) and "latest"; the server pins a sha tag.
name: images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # PageProps/LayoutProps are generated into .next/ (normally by next dev or next build).
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint src --quiet
      - run: npm test

  build:
    needs: check
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - image: parapilot-erpnext
            context: .
            file: deploy/Dockerfile
          - image: parapilot-web
            context: web
            file: web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/adil-arhrimaz/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
